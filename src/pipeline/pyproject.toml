[project]
name = "searise-pipeline"
version = "0.1.0"
requires-python = ">=3.9"
# Versioned lower and upper bounds. The 2026-04-13 audit found that
# unversioned entries let pip install numpy 2.x, which breaks xarray
# collection at pytest time. Upper bounds below match the last known-good
# major series at the time of pinning — bump deliberately, not by drift.
dependencies = [
    "click>=8.1,<9.0",
    "cryptography>=42,<51",
    "geopandas>=0.14,<2.0",
    "jsonschema[format]>=4.23,<5.0",
    "netCDF4>=1.6,<2.0",
    "numpy>=1.26,<2.0",
    "pandas==2.3.2",
    "pyarrow==16.1.0",
    "pyproj==3.6.1",
    "rasterio>=1.3,<2.0",
    "rio-cogeo>=5.0,<6.0",
    "shapely==2.0.7",
    "xarray>=2024.1,<2025.0",
]

[project.scripts]
searise-release = "searise_pipeline.offline_release.cli:cli"
searise-candidate-contract = "searise_pipeline.candidate_completeness.cli:cli"
searise-sources = "searise_pipeline.sources.cli:cli"
searise-settlement-spatial-toolchain = "searise_pipeline.settlements.spatial_toolchain:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = [
    "searise_pipeline",
    "searise_pipeline.candidate_completeness",
    "searise_pipeline.offline_release",
    "searise_pipeline.regional_fixture",
    "searise_pipeline.release",
    "searise_pipeline.science",
    "searise_pipeline.settlements",
    "searise_pipeline.sources",
    "searise_pipeline.supply_chain",
]

[tool.setuptools.package-dir]
searise_pipeline = "searise_pipeline"

[tool.setuptools.package-data]
"searise_pipeline.offline_release" = ["schemas/*.schema.json"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
