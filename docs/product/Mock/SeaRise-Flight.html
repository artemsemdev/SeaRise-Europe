document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

55,255,255,.86); text-shadow: 0 1px 14px rgba(4,20,25,.6); max-width: 44ch; margin-left: auto; margin-right: auto;\">Name a European coastal settlement. You will fly to it and watch the modelled scenario play out — computed in your browser, in about fifteen seconds.<\u002Fp>\n        <div style=\"position: relative; text-align: left;\">\n          <div style=\"display: flex; align-items: center; gap: 14px; height: 66px; padding: 0 10px 0 22px; border-radius: 999px; background: rgba(255,255,255,.96); box-shadow: 0 20px 60px -20px rgba(4,20,25,.7);\">\n            <span aria-hidden=\"true\" style=\"width: 16px; height: 16px; border: 1.7px solid #6b7a7e; border-radius: 50%; flex: none;\"><\u002Fspan>\n            <input id=\"flight-search\" type=\"text\" role=\"combobox\" aria-expanded=\"{{ listOpen }}\" aria-controls=\"flight-listbox\" aria-autocomplete=\"list\" aria-activedescendant=\"{{ activeId }}\" aria-label=\"Search a European settlement\" placeholder=\"Wilhelmshaven, Ravenna, Bergen…\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" sc-camel-on-key-down=\"{{ onKeys }}\" sc-camel-on-focus=\"{{ onFocus }}\" style=\"flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: 'Instrument Sans', sans-serif; font-size: 17px; color: #0c1517;\">\n            <button sc-camel-on-click=\"{{ takeMe }}\" style=\"padding: 0 22px; height: 48px; border-radius: 999px; background: #0c1517; color: #ffffff; font-size: 14px; font-weight: 500; flex: none;\" style-hover=\"background: #0a6c78;\">Fly there<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"display: inline-block; margin: 14px auto 0; padding: 7px 14px; border-radius: 999px; background: rgba(5,26,32,.62); backdrop-filter: blur(8px); font-size: 12.5px; line-height: 1.45; color: rgba(255,255,255,.92);\">Settlements only — not addresses, postcodes or landmarks. {{ indexNote }}<\u002Fp>\n\n          <sc-if value=\"{{ listOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position: absolute; left: 0; right: 0; top: 82px; background: #ffffff; border-radius: 24px; padding: 8px; box-shadow: 0 30px 70px -24px rgba(4,20,25,.7); animation: fRise .18s ease-out;\">\n              <p role=\"status\" style=\"margin: 0; padding: 8px 14px 10px; font-family: 'Geist Mono', monospace; font-size: 11px; color: #5b6a6e;\">{{ countLabel }}<\u002Fp>\n              <div id=\"flight-listbox\" role=\"listbox\" aria-label=\"Settlement matches\" style=\"display: flex; flex-direction: column; gap: 2px; max-height: 264px; overflow: auto;\">\n                <sc-for list=\"{{ matches }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <button id=\"{{ m.domId }}\" role=\"option\" aria-selected=\"{{ m.active }}\" sc-camel-on-click=\"{{ m.select }}\" sc-camel-on-mouse-enter=\"{{ m.hover }}\" style=\"display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 15px; border-radius: 16px; background: {{ m.bg }}; min-height: 54px;\">\n                    <span style=\"flex: 1; min-width: 0;\">\n                      <span style=\"display: block; font-size: 15px; font-weight: 500;\">{{ m.name }}<\u002Fspan>\n                      <span style=\"display: block; font-size: 12.5px; color: #5b6a6e; margin-top: 1px;\">{{ m.context }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font-family: 'Geist Mono', monospace; font-size: 10.5px; padding: 4px 9px; border-radius: 999px; color: {{ m.tagFg }}; background: {{ m.tagBg }}; flex: none;\">{{ m.tag }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ noMatches }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 10px 15px 16px;\">\n                  <div style=\"font-size: 14.5px; font-weight: 500; margin-bottom: 4px;\">No settlement matches that name<\u002Fdiv>\n                  <div style=\"font-size: 12.5px; line-height: 1.5; color: #5b6a6e;\">The index is working — it simply holds no such place. Try the local spelling, or the nearest larger settlement.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n    <div aria-hidden=\"true\" style=\"position: absolute; left: 50%; top: clamp(80px, 12vh, 140px); transform: translateX(-50%); z-index: 25; text-align: center; animation: fFade .6s ease;\">\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; color: rgba(255,255,255,.72); margin-bottom: 6px;\">{{ stageLabel }}<\u002Fdiv>\n      <div style=\"font-family: 'Instrument Serif', serif; font-size: clamp(56px, 9vw, 128px); line-height: .96; letter-spacing: -0.03em; color: #ffffff; text-shadow: 0 4px 40px rgba(4,20,25,.7);\">{{ bigYear }}<\u002Fdiv>\n      <div style=\"margin-top: 10px; font-size: 14.5px; color: rgba(255,255,255,.9); text-shadow: 0 1px 14px rgba(4,20,25,.7);\">{{ stageCaption }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: absolute; left: 50%; bottom: clamp(26px, 4vh, 46px); transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 20px; border-radius: 999px; background: rgba(255,255,255,.9); backdrop-filter: blur(14px); box-shadow: 0 20px 50px -22px rgba(4,20,25,.7);\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #5b6a6e;\">{{ progressLabel }}<\u002Fspan>\n      <span style=\"position: relative; display: block; width: clamp(120px, 22vw, 260px); height: 4px; border-radius: 999px; background: #dfe4e2; overflow: hidden;\">\n        <span style=\"position: absolute; left: 0; top: 0; bottom: 0; width: {{ progressWidth }}; background: #0a6c78; transition: width {{ progressDur }} linear;\"><\u002Fspan>\n      <\u002Fspan>\n      <button sc-camel-on-click=\"{{ skip }}\" style=\"padding: 0 18px; height: 42px; border-radius: 999px; background: #0c1517; color: #ffffff; font-size: 13px; font-weight: 500;\">Skip<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; z-index: 28; pointer-events: none;\">\n\n      <div ref=\"{{ panelRef }}\" style=\"position: absolute; left: {{ panelLeft }}; right: {{ panelRight }}; bottom: {{ panelBottom }}; width: {{ panelWidth }}; max-height: {{ panelMaxH }}; overflow: auto; pointer-events: auto; background: rgba(255,255,255,.94); backdrop-filter: blur(18px); border-radius: {{ panelRadius }}; padding: clamp(20px, 2vw, 28px); box-shadow: 0 30px 70px -28px rgba(4,20,25,.75); animation: fRise .4s cubic-bezier(.22,1,.36,1);\">\n        <sc-if value=\"{{ showResult }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 14px;\">\n            <span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px; background: {{ stateBg }};\">\n              <span aria-hidden=\"true\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: {{ stateFg }};\">{{ stateGlyph }}<\u002Fspan>\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: {{ stateFg }};\">{{ stateCode }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; color: #5b6a6e;\">{{ scenarioId }} · {{ year }}<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin: 0 0 6px; font-family: 'Instrument Serif', serif; font-size: clamp(27px, 2.6vw, 34px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 400; color: {{ stateFg }}; text-wrap: pretty;\">{{ heading }}<\u002Fh2>\n          <p style=\"margin: 0 0 16px; font-size: 15px; line-height: 1.4;\">{{ placeName }} <span style=\"color: #5b6a6e;\">· {{ placeContext }}<\u002Fspan><\u002Fp>\n          <p style=\"margin: 0 0 18px; font-size: 14.5px; line-height: 1.6; color: #3d4a4e; text-wrap: pretty;\">{{ explanation }}<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showFailure }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom: 18px;\">\n            <span style=\"display: inline-block; padding: 5px 11px; border-radius: 999px; background: #fdecea; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: #b42318;\">TECHNICAL FAILURE — NOT A RESULT<\u002Fspan>\n            <h2 style=\"margin: 14px 0 8px; font-family: 'Instrument Serif', serif; font-size: clamp(25px, 2.4vw, 31px); line-height: 1.1; font-weight: 400;\">{{ failureTitle }}<\u002Fh2>\n            <p style=\"margin: 0 0 6px; font-size: 15px; line-height: 1.4;\">{{ placeName }} <span style=\"color: #5b6a6e;\">· {{ scenarioId }} · {{ year }}<\u002Fspan><\u002Fp>\n            <p style=\"margin: 12px 0 14px; font-size: 14.5px; line-height: 1.6; color: #3d4a4e;\">{{ failureBody }}<\u002Fp>\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 11.5px; line-height: 1.7; color: #56656a; background: #f3f5f3; border-radius: 16px; padding: 14px 16px; white-space: pre-line;\">{{ failureDetail }}<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px;\">\n              <button sc-camel-on-click=\"{{ retry }}\" style=\"padding: 0 18px; min-height: 46px; border-radius: 999px; background: #0c1517; color: #ffffff; font-size: 13.5px; font-weight: 500;\">Retry assessment<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ openMethodology }}\" style=\"padding: 0 18px; min-height: 46px; border-radius: 999px; background: #eef1ef; font-size: 13.5px;\">Release details<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin: 14px 0 0; font-size: 12.5px; line-height: 1.55; color: #66757a;\">Your selection, scenario and horizon are kept. Nothing has been substituted from another scenario, horizon or neighbouring cell, and no result state is shown.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: grid; gap: 14px; margin-bottom: 18px;\">\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px;\">\n              <span style=\"font-size: 12px; font-weight: 600;\">Emissions scenario<\u002Fspan>\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 10.5px; color: #66757a;\">{{ scenarioDesc }}<\u002Fspan>\n            <\u002Fdiv>\n            <div role=\"radiogroup\" aria-label=\"Emissions scenario\" style=\"position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 999px; background: #eef1ef;\">\n              <div aria-hidden=\"true\" style=\"position: absolute; top: 4px; bottom: 4px; left: {{ sspLeft }}; width: {{ segWidth }}; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 3px rgba(12,21,23,.14); transition: left .3s cubic-bezier(.22,1,.36,1);\"><\u002Fdiv>\n              <sc-for list=\"{{ scenarios }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <button role=\"radio\" aria-checked=\"{{ s.on }}\" sc-camel-on-click=\"{{ s.select }}\" style=\"position: relative; z-index: 1; min-height: 44px; border-radius: 999px; font-family: 'Geist Mono', monospace; font-size: 12.5px; font-weight: 500; color: {{ s.fg }};\">{{ s.id }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px;\">\n              <span style=\"font-size: 12px; font-weight: 600;\">Time horizon<\u002Fspan>\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 10.5px; color: #66757a;\">absolute years<\u002Fspan>\n            <\u002Fdiv>\n            <div role=\"radiogroup\" aria-label=\"Time horizon\" style=\"position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 999px; background: #eef1ef;\">\n              <div aria-hidden=\"true\" style=\"position: absolute; top: 4px; bottom: 4px; left: {{ yearLeft }}; width: {{ segWidth }}; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 3px rgba(12,21,23,.14); transition: left .3s cubic-bezier(.22,1,.36,1);\"><\u002Fdiv>\n              <sc-for list=\"{{ horizons }}\" as=\"h\" hint-placeholder-count=\"3\">\n                <button role=\"radio\" aria-checked=\"{{ h.on }}\" sc-camel-on-click=\"{{ h.select }}\" style=\"position: relative; z-index: 1; min-height: 44px; border-radius: 999px; font-family: 'Geist Mono', monospace; font-size: 13.5px; font-weight: 500; color: {{ h.fg }};\">{{ h.year }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;\">\n          <button sc-camel-on-click=\"{{ replay }}\" style=\"display: inline-flex; align-items: center; gap: 9px; padding: 0 18px; min-height: 46px; border-radius: 999px; background: #0c1517; color: #ffffff; font-size: 13.5px; font-weight: 500;\" style-hover=\"background: #0a6c78;\"><span aria-hidden=\"true\" style=\"font-family: 'Geist Mono', monospace;\">↻<\u002Fspan> Replay the scene<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ reset }}\" style=\"padding: 0 18px; min-height: 46px; border-radius: 999px; background: #eef1ef; font-size: 13.5px;\" style-hover=\"background: #e2f1f2; color: #08535c;\">Another place<\u002Fbutton>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ toggleDetails }}\" aria-expanded=\"{{ detailsOpen }}\" style=\"display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #f3f5f3; min-height: 48px;\" style-hover=\"background: #eceeec;\">\n          <span style=\"font-size: 13.5px; font-weight: 500;\">Limitations, method and release identity<\u002Fspan>\n          <span aria-hidden=\"true\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: #5b6a6e;\">{{ detailsGlyph }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ detailsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 16px 2px 0; animation: fRise .2s ease-out;\">\n            <h3 style=\"margin: 0 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #66757a;\">What this result does not say<\u002Fh3>\n            <div style=\"display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px;\">\n              <sc-for list=\"{{ limitations }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; gap: 10px; font-size: 13.5px; line-height: 1.55; color: #56656a;\">\n                  <span aria-hidden=\"true\" style=\"color: #aab5b8; flex: none;\">—<\u002Fspan><span>{{ l }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px 18px; margin-bottom: 16px;\">\n              <sc-for list=\"{{ meta }}\" as=\"m\" hint-placeholder-count=\"6\">\n                <div>\n                  <div style=\"font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #66757a; margin-bottom: 3px;\">{{ m.k }}<\u002Fdiv>\n                  <div style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: #3d4a4e;\">{{ m.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n              <button sc-camel-on-click=\"{{ openMethodology }}\" style=\"padding: 10px 15px; border-radius: 999px; background: #eef1ef; font-size: 12.5px; min-height: 44px;\">Methodology &amp; sources<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ openMethodology }}\" style=\"padding: 10px 15px; border-radius: 999px; background: #eef1ef; font-size: 12.5px; min-height: 44px;\">Full disclaimer<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 18px;\">\n          <span style=\"font-size: 11.5px; color: #66757a;\">Demo the edge cases:<\u002Fspan>\n          <sc-for list=\"{{ simulations }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ s.select }}\" aria-pressed=\"{{ s.on }}\" style=\"padding: 0 13px; min-height: 40px; border-radius: 999px; font-size: 12px; background: {{ s.bg }}; color: {{ s.fg }};\">{{ s.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <p style=\"margin: 16px 0 0; font-size: 11.5px; line-height: 1.55; color: #66757a;\">Scenario model output on a coarse analysis grid. Not a forecast, safety statement, engineering, insurance or legal assessment.<\u002Fp>\n        <p style=\"display: {{ narrowOnly }}; margin: 12px 0 0; font-family: 'Geist Mono', monospace; font-size: 10px; line-height: 1.6; color: #66757a;\">{{ attribution }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"position: absolute; right: clamp(18px, 2.4vw, 34px); top: clamp(84px, 12vh, 116px); pointer-events: auto; display: {{ legendDisplay }}; flex-direction: column; align-items: flex-end; gap: 10px; animation: fRise .5s cubic-bezier(.22,1,.36,1);\">\n        <div style=\"padding: 13px 16px; border-radius: 20px; background: rgba(255,255,255,.9); backdrop-filter: blur(14px); box-shadow: 0 14px 40px -22px  .24s ease-out;\">\n        <div style=\"display: flex; align-items: flex-start; gap: 16px; padding: 26px 28px 18px;\">\n          <div style=\"flex: 1;\">\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.07em; color: #0a6c78; margin-bottom: 8px;\">METHODOLOGY V1.0 · {{ releaseId }}<\u002Fdiv>\n            <h2 id=\"flight-meth-title\" style=\"margin: 0; font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1.1; font-weight: 400; letter-spacing: -0.015em;\">How this scene was produced<\u002Fh2>\n          <\u002Fdiv>\n          <button ref=\"{{ closeRef }}\" sc-camel-on-click=\"{{ closeMethodology }}\" aria-label=\"Close\" style=\"width: 44px; height: 44px; border-radius: 15px; background: #f3f5f3; font-family: 'Geist Mono', monospace; font-size: 15px; flex: none;\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding: 0 28px 28px; overflow: auto; display: flex; flex-direction: column; gap: 16px;\">\n          <span style=\"align-self: flex-start; padding: 5px 11px; border-radius: 999px; background: #fdefdb; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: #8a4d06;\">DATA STATUS · SYNTHETIC<\u002Fspan>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.65; color: #3d4a4e;\">The animation is an illustration of one classified layer, not a simulation of a flood event. Each of the nine scenario/horizon layers labels every analysis cell exposed or not exposed by comparing a modelled sea-level value with modelled terrain elevation. Your coordinate is matched to the single nearest cell; values are never interpolated or read from the colours on screen.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <sc-for list=\"{{ methSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 14px; padding: 15px 16px; border-radius: 18px; background: #f3f5f3;\">\n ions: [\"It does not say that any individual building, plot or street will flood.\", \"It is a scenario model output on a coarse analysis grid, not a dated prediction.\", \"It does not account for dikes, dunes, pumps or future adaptation works.\"] },\n  notexposed: { code: \"NO MODELED EXPOSURE DETECTED\", glyph: \"\\u25CB\", fg: \"#0f6b60\", bg: \"#dff2ee\", heading: \"No modeled exposure detected\",\n    limitations: [\"It does not mean this location is safe or free from climate risk.\", \"Storm surge, waves, river flooding, groundwater and erosion are out of scope.\", \"A later horizon or a different scenario can produce a different result.\"] },\n  unavailable: { code: \"DATA UNAVAILABLE\", glyph: \"\\u2014\", fg: \"#42525c\", bg: \"#eef1f4\", heading: \"Data unavailable for this location\",\n    limitations: [\"Missing data is not evidence of the absence of exposure.\", \"No value from another scenario, horizon or neighbouring cell has been substituted.\", \"The gap is recorded in this release's data-quality summary.\"] },\n  outofscope: { code: \"OUT OF SCOPE\", glyph: \"\\u25C7\", fg: \"#4a3f97\", bg: \"#ecebfb\", heading: \"Outside the coastal analysis area\",\n    limitations: [\"It does not mean sea-level rise is irrelevant to this country or region.\", \"Inland and river flooding are not modelled by this product at all.\", \"The coastal zone is a release-scoped product boundary, not a flood-reach estimate.\"] }\n};\n\nconst BLOCKS = [\n  [11, 60, 3.6, 2.8], [17, 57.5, 3, 2.4], [23, 61, 4.2, 3.2], [30, 58.5, 3.2, 2.6], [35, 63, 4.8, 3.4],\n  [43, 60.5, 3.6, 3], [50, 56.5, 3, 2.4], [55, 62.5, 4.4, 3.4], [62, 58.5, 3.4, 2.8], [69, 63, 4.2, 3.2],\n  [77, 57.5, 3.2, 2.6], [83, 61.5, 4.6, 3.6], [14, 68, 5.4, 3.6], [27, 70, 4.4, 3.2], [40, 72, 6, 4],\n  [56, 70, 4.8, 3.4], [70, 72, 5.6, 3.8], [85, 68, 4.2, 3]\n];\n\nconst norm = s => (s || \"\").toLowerCase().normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\");\n\nclass Component extends DCLogic {\n  state = { phase: \"idle\", query: \"\", focused: false, active: 0, place: null, ssp: \"ssp2-45\", year: \"2050\", stage: 0, detailsOpen: false, meth: false, scrub: false, sim: \"\", vw: 1280 };\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ vw: window.innerWidth });\n    this._onKey = e => { if (e.key === \"Escape\" && this.state.meth) this.closeMeth(); };\n    window.addEventListener(\"resize\", this._onResize);\n    window.addEventListener(\"keydown\", this._onKey);\n    this.setState({ vw: window.innerWidth });\n  }\n\n  componentWillUnmount() {\n    this.clear();\n    window.removeEventListener(\"resize\", this._onResize);\n    window.removeEventListener(\"keydown\", this._onKey);\n  }\n\n  openMeth(e) {\n    this._trigger = e && e.currentTarget;\n    this.setState({ meth: true });\n    setTimeout(() => { if (this._closeBtn && this._closeBtn.focus) this._closeBtn.focus(); }, 60);\n  }\n\n  closeMeth() {\n    this.setState({ meth: false });\n    setTimeout(() => { if (this._trigger && this._trigger.focus) this._trigger.focus(); }, 40);\n  }\n\n  openDetails() {\n    const next = !this.state.detailsOpen;\n    this.setState({ detailsOpen: next });\n    if (next) setTimeout(() => { if (this._panel) this._panel.scrollTop = this._panel.scrollHeight; }, 90);\n  }\n  clear() { (this._timers || []).forEach(clearTimeout); this._timers = []; }\n  later(fn, ms) { (this._timers = this._timers || []).push(setTimeout(fn, ms)); }\n\n  matchesFor(q) {\n    const n = norm(q).trim();\n    if (!n) return [];\n    return PLACES.filter(p => norm(p.name).indexOf(n) > -1 || norm(p.admin).indexOf(n) === 0 || norm(p.country).indexOf(n) === 0)\n      .sort((a, b) => (norm(a.name).indexOf(n) - norm(b.name).indexOf(n)) || (parseInt(b.pop.replace(/\\D/g, \"\") || \"0\", 10) - parseInt(a.pop.replace(/\\D/g, \"\") || \"0\", 10)))\n      .slice(0, 6);\n  }\n\n  reduced() {\n    try { return window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches; } catch (e) { return false; }\n  }\n\n  fly(place) {\n    this.clear();\n    this.setState({ place: place, query: \"\", focused: false, detailsOpen: false, scrub: false });\n    if (this.reduced()) { this.setState({ phase: \"done\", stage: 3 }); return; }\n    this.setState({ phase: \"flight\", stage: 0 });\n    this.later(() => this.setState({ phase: \"play\", stage: 1 }), 4200);\n    this.later(() => this.setState({ stage: 2 }), 7600);\n    this.later(() => this.setState({ stage: 3 }), 11000);\n    this.later(() => this.setState({ phase: \"done\" }), 13400);\n  }\n\n  replay() {\n    const p = this.state.place;\n    this.clear();\n    this.setState({ phase: \"flight\", stage: 0, scrub: false });\n    this.later(() => this.setState({ phase: \"play\", stage: 1 }), 900);\n    this.later(() => this.setState({ stage: 2 }), 4300);\n    this.later(() => this.setState({ stage: 3 }), 7700);\n    this.later(() => this.setState({ phase: \"done\" }), 10100);\n    return p;\n  }\n\n  resolve() {\n    const p = this.state.place;\n    if (!p) return null;\n    if (p.t === null) return \"outofscope\";\n    if (p.t === \"nodata\") return \"unavailable\";\n    const s = SCEN.find(x => x.key === this.state.ssp).rank;\n    const h = HOR.find(x => x.year === this.state.year).rank;\n    return (s + h) >= p.t ? \"exposed\" : \"notexposed\";\n  }\n\n  renderVals() {\n    const st = this.state;\n    const place = st.place;\n    const phase = st.phase;\n    const scen = SCEN.find(s => s.key === st.ssp);\n    const sspIdx = SCEN.indexOf(scen);\n    const yearIdx = HOR.findIndex(h => h.year === st.year);\n    const matches = this.matchesFor(st.query);\n    const listOpen = st.focused && st.query.trim().length > 0;\n    const failing = st.sim === \"artifact\";\n    const rs = failing ? null : this.resolve();\n    const S = rs ? STATES[rs] : null;\n    const narrow = st.vw < 780;\n    const inland = place && place.t === null;\n\n    // water advance: 0 (offshore) → 1 (final selected horizon)\n    const target = Math.min(1, (SCEN.find(s => s.key === st.ssp).rank * 0.42 + yearIdx * 0.75) / 2.34);\n    const sweep = phase === \"idle\" || phase === \"flight\" ? 0 : phase === \"play\" ? [0.16, 0.42, 0.72, 1][Math.min(st.stage, 3)] * target : target;\n    const floodTopPct = 76 - (inland ? sweep * 6 : sweep * 33);\n\n    const stageYears = [\"today\", \"2030\", \"2050\", \"2100\"];\n    const shownYearIdx = phase === \"play\" ? Math.min(st.stage, yearIdx + 1) : yearIdx + 1;\n\n    const explanations = {\n      exposed: \"Under \" + scen.id + \" at \" + st.year + \", the modelled sea-level value in this data release is at or above the modelled terrain elevation of the analysis cell nearest to the selected point.\",\n      notexposed: \"Under \" + scen.id + \" at \" + st.year + \", the modelled sea-level value in this data release stays below the modelled terrain elevation of the analysis cell nearest to the selected point.\",\n      unavailable: \"The analysis raster for \" + scen.id + \" at \" + st.year + \" holds no valid classified value at the cell nearest to this point, so no exposure conclusion can be drawn for it.\",\n      outofscope: \"This settlement lies inside the Europe support geometry but outside the versioned coastal analysis zone, so coastal exposure is not modelled for it in this release.\"\n    };\n    const metaFor = {\n      exposed: [[\"Methodology\", \"v1.0\"], [\"Data release\", RELEASE], [\"Class value\", \"1 \\u00B7 exposed\"], [\"Lookup\", \"exact nearest cell\"], [\"Artifact\", \"analysis/\" + st.ssp + \"/\" + st.year + \".tif\"], [\"Data status\", \"synthetic\"]],\n      notexposed: [[\"Methodology\", \"v1.0\"], [\"Data release\", RELEASE], [\"Class value\", \"0 \\u00B7 not exposed\"], [\"Lookup\", \"exact nearest cell\"], [\"Artifact\", \"analysis/\" + st.ssp + \"/\" + st.year + \".tif\"], [\"Data status\", \"synthetic\"]],\n      unavailable: [[\"Methodology\", \"v1.0\"], [\"Data release\", RELEASE], [\"Class value\", \"nodata\"], [\"Read\", \"range OK \      takeMe: () => { const m = this.matchesFor(this.state.query); if (m[this.state.active]) this.fly(m[this.state.active]); else this.setState({ focused: true }); },\n\n      stageLabel: phase === \"flight\" ? \"FLYING TO \" + (place ? place.name.toUpperCase() : \"\") : \"MODELLED SCENE \\u00B7 \" + scen.id,\n      bigYear: phase === \"flight\" ? (place ? place.name : \"\") : stageYears[Math.min(shownYearIdx, 3)],\n      stageCaption: phase === \"flight\" ? (place ? place.admin + \", \" + place.country : \"\") : (captions[Math.min(st.stage, 3)] || \"\"),\n      progressLabel: phase === \"flight\" ? \"approach\" : \"scene\",\n      progressWidth: phase === \"flight\" ? \"22%\" : \"100%\",\n      progressDur: phase === \"flight\" ? \"4.4s\" : \"9.2s\",\n      skip: () => { this.clear(); this.setState({ phase: \"done\", stage: 3 }); },\n\n      segWidth: \"calc((100% - 8px) / 3)\",\n      sspLeft: \"calc(4px + \" + sspIdx + \" * (100% - 8px) / 3)\",\n      yearLeft: \"calc(4px + \" + yearIdx + \" * (100% - 8px) / 3)\",\n      scenarioId: scen.id,\n      scenarioDesc: scen.desc,\n      year: st.year,\n      scenarios: SCEN.map(s => ({\n        id: s.id, on: s.key === st.ssp,\n        fg: s.key === st.ssp ? \"#0a6c78\" : \"#56656a\",\n        select: () => this.setState({ ssp: s.key, scrub: true })\n      })),\n      horizons: HOR.map(h => ({\n        year: h.year, on: h.year === st.year,\n        fg: h.year === st.year ? \"#0a6c78\" : \"#56656a\",\n        select: () => this.setState({ year: h.year, scrub: true })\n      })),\n\n      stateCode: S ? S.code : \"\",\n      stateGlyph: S ? S.glyph : \"\",\n      stateFg: S ? S.fg : \"#0c1517\",\n      stateBg: S ? S.bg : \"#f3f5f3\",\n      heading: S ? S.heading : \"\",\n      placeName: place ? place.name : \"\",\n      placeContext: place ? place.admin + \" \\u00B7 \" + place.country + \" \\u00B7 \" + place.coords + \" \\u00B7 \" + place.shore : \"\",\n      explanation: rs ? explanations[rs] : \"\",\n      limitations:
