name: Phase 0R owner promotion
run-name: >-
  Phase 0R owner decision from validation run ${{ inputs.validation_run_id }}
  for evidence PR #${{ inputs.evidence_pr_number }}

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful CI run containing exact Linux and macOS ARM64 candidates
        required: true
        type: string
      evidence_pr_number:
        description: Evidence-only pull request already merged to master
        required: true
        type: string
      decision:
        description: Project-owner release decision
        required: true
        type: choice
        options:
          - approved
          - rejected

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: phase-0r-owner-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and record owner decision
    environment: phase-0r-owner-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEARISE_OWNER_ENVIRONMENT: phase-0r-owner-approval
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
      EVIDENCE_PR_NUMBER: ${{ inputs.evidence_pr_number }}
      OWNER_DECISION: ${{ inputs.decision }}
    steps:
      - name: Validate protected dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "artemsemdev/SeaRise-Europe" ]]
          [[ "${GITHUB_REF}" == "refs/heads/master" ]]
          [[ "${GITHUB_ACTOR}" == "artemsemdev" ]]
          [[ "${GITHUB_TRIGGERING_ACTOR}" == "artemsemdev" ]]
          [[ "${GITHUB_WORKFLOW}" == "Phase 0R owner promotion" ]]
          [[ "${GITHUB_WORKFLOW_REF}" == "artemsemdev/SeaRise-Europe/.github/workflows/phase-0r-owner-promotion.yml@refs/heads/master" ]]
          [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]]
          [[ "${VALIDATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EVIDENCE_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${OWNER_DECISION}" == "approved" || "${OWNER_DECISION}" == "rejected" ]]

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: src/pipeline/requirements-release.lock

      - name: Install immutable promotion environment
        working-directory: src/pipeline
        run: |
          pip install --only-binary=:all: --require-hashes -r requirements-release.lock

      - name: Verify GitHub provenance and finalize owner gate
        id: promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src/pipeline
        run: |
          python scripts/science/promote_phase_0r_release.py \
            --validation-run-id "${VALIDATION_RUN_ID}" \
            --evidence-pr-number "${EVIDENCE_PR_NUMBER}" \
            --decision "${OWNER_DECISION}"
          release_id="$(jq -r '.releaseId' "${RUNNER_TEMP}/phase-0r-owner-promotion/promotion.json")"
          source_revision="$(jq -r '.candidateSourceSha' "${RUNNER_TEMP}/phase-0r-owner-promotion/integration-merge.json")"
          [[ "${release_id}" =~ ^[a-z0-9]+([.-][a-z0-9]+)*$ ]]
          [[ "${source_revision}" =~ ^[0-9a-f]{40}$ ]]
          printf 'decision_artifact_name=phase-0r-owner-decision-%s-%s\n' \
            "${release_id}" "${source_revision}" >> "${GITHUB_OUTPUT}"

      - name: Prove the reviewed checkout stayed immutable
        run: git diff --exit-code -- .

      - name: Upload authoritative promotion records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.promote.outputs.decision_artifact_name }}
          path: ${{ runner.temp }}/phase-0r-owner-promotion
          if-no-files-found: error
          retention-days: 90
