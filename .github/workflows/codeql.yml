# =============================================================================
# SeaRise Europe — path-aware CodeQL analysis
# =============================================================================

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - master
      - "integration/**"
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      javascript: ${{ steps.route.outputs.codeql_javascript }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: route
        name: Route changed languages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            python3 scripts/ci/changed_components.py --all --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci/changed_components.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi

  analyze-javascript:
    name: Analyze (javascript-typescript)
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@28deaeda66b76a05916b6923827895f2b14ab387 # v3.28.16
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@28deaeda66b76a05916b6923827895f2b14ab387 # v3.28.16
        with:
          category: /language:javascript-typescript

  codeql-gate:
    name: CodeQL Gate
    needs:
      - changes
      - analyze-javascript
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify exact routed analysis results
        env:
          ROUTES: '{"codeql_javascript":"${{ needs.changes.outputs.javascript }}"}'
          JOBS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/ci/verify_ci_gate.py
          --profile codeql
          --routes-json "${ROUTES}"
          --jobs-json "${JOBS}"
