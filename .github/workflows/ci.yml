# =============================================================================
# SeaRise Europe — path-aware CI
# =============================================================================
# A lightweight router always runs so required checks resolve for docs-only
# changes. Expensive jobs run only for the components they validate.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - master
      - "integration/**"
  workflow_dispatch:
    inputs:
      release_source_revision:
        description: Exact commit SHA to build for independent AR6 evidence
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.route.outputs.frontend }}
      api: ${{ steps.route.outputs.api }}
      pipeline: ${{ steps.route.outputs.pipeline }}
      release: ${{ steps.route.outputs.release }}
      infrastructure: ${{ steps.route.outputs.infrastructure }}
      docker_frontend: ${{ steps.route.outputs.docker_frontend }}
      docker_api: ${{ steps.route.outputs.docker_api }}
      compose: ${{ steps.route.outputs.compose }}
      heavy: ${{ steps.route.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: route
        name: Route changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_SOURCE_REVISION: ${{ inputs.release_source_revision }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${RELEASE_SOURCE_REVISION}" ]]; then
            python3 scripts/ci/changed_components.py --release-only --github-output "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            python3 scripts/ci/changed_components.py --all --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci/changed_components.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi

  frontend:
    name: Frontend (lint, type-check, test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=critical --omit=dev
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Content guidelines lint
        run: npm run lint:content

      - name: i18n externalization lint
        run: npm run lint:i18n

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

  api:
    name: API (format, build, test)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SeaRise.sln

      - name: Audit dependencies
        run: dotnet list SeaRise.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt && ! grep -qi 'has the following vulnerable packages' audit.txt

      - name: Format check
        run: dotnet format SeaRise.sln --verify-no-changes

      - name: Build
        run: dotnet build SeaRise.sln --no-restore -c Release

      - name: Unit Tests
        run: dotnet test SeaRise.sln --no-build -c Release --verbosity normal --filter "Category=Unit"

      - name: Integration Tests
        run: dotnet test SeaRise.sln --no-build -c Release --verbosity normal --filter "Category=Integration"

  pipeline:
    name: Pipeline (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/pipeline
    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: src/pipeline/requirements-release.lock

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install --only-binary=:all: --require-hashes -r requirements-release.lock
          pip install ruff mypy pytest

      - name: Validate test migration contracts
        run: |
          PYTHONPATH=../.. python ../../scripts/tests/validate_test_inventory.py
          PYTHONPATH=../.. python -m unittest discover -s ../../tests/harness -p 'test_*.py'
          PYTHONPATH=../.. python ../../scripts/tests/run_mutation_pilot.py --verify-report ../../tests/evidence/mutation-pilot-result-state.json

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check target domain
        run: mypy searise_pipeline/domain

      - name: Validate audited source registry
        run: |
          python -m searise_pipeline.sources validate
          python -m searise_pipeline.sources publication-check
          git -C ../.. check-ignore -q data/raw/sources/example.bin
          git -C ../.. check-ignore -q artifacts/acquisition-receipts/example.json

      - name: Unit tests
        run: pytest tests/ -v

  release-toolchain:
    name: AR6 release toolchain (pinned Linux)
    needs: changes
    if: >-
      needs.changes.outputs.release == 'true' &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/pipeline
    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: src/pipeline/requirements-release.lock

      - name: Restore verified release tools
        id: release-tools
        uses: actions/cache@v4.2.4
        with:
          path: .ci-cache/ar6-tools
          key: ar6-tools-linux-x86_64-${{ hashFiles('src/pipeline/science/ar6-regional-release.json', 'src/pipeline/toolchain/tippecanoe-linux-x86_64-build-receipt.json') }}

      - name: Install immutable Python release environment
        run: |
          pip install --only-binary=:all: --require-hashes -r requirements-release.lock
          pip install -e . --no-deps
          pip install pytest==8.4.2

      - name: Build and verify pinned Tippecanoe
        run: |
          mkdir -p ../../.ci-cache/ar6-tools
          if [[ ! -f ../../.ci-cache/ar6-tools/tippecanoe-2.79.0.tar.gz ]]; then
            curl --fail --location --output ../../.ci-cache/ar6-tools/tippecanoe-2.79.0.tar.gz https://github.com/felt/tippecanoe/archive/refs/tags/2.79.0.tar.gz
          fi
          echo 'b0fd9df49b6efc988288ea48774822c6de19eb48428017f27ee0b3b01d44f05d  ../../.ci-cache/ar6-tools/tippecanoe-2.79.0.tar.gz' | sha256sum -c -
          echo '8d5fb782ea81bc19c9c8d71e31aae19a01bc448f401fd10114f633bd2a6c2dc5  toolchain/Dockerfile.tippecanoe-linux-x86_64' | sha256sum -c -
          if [[ ! -x ../../.ci-cache/ar6-tools/tippecanoe || ! -x ../../.ci-cache/ar6-tools/tippecanoe-decode ]]; then
            docker build --platform linux/amd64 --tag searise-tippecanoe:2.79.0 \
              --file toolchain/Dockerfile.tippecanoe-linux-x86_64 \
              ../../.ci-cache/ar6-tools
            docker run --platform linux/amd64 --rm \
              --volume "${GITHUB_WORKSPACE}/.ci-cache/ar6-tools:/out" \
              searise-tippecanoe:2.79.0
          fi
          echo 'a70bb67594919b0eae357ec4678c77f5c3b9d4a277bd11046e4d9d03b1c6c426  ../../.ci-cache/ar6-tools/tippecanoe' | sha256sum -c -
          echo '27d15c0f9394b2b29187312103a94579a9262a365d5b3eb71f1e5677751d2c36  ../../.ci-cache/ar6-tools/tippecanoe-decode' | sha256sum -c -

      - name: Acquire and verify pinned go-pmtiles
        run: |
          if [[ ! -x ../../.ci-cache/ar6-tools/pmtiles ]]; then
            curl --fail --location --output ../../.ci-cache/ar6-tools/go-pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
            echo '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  ../../.ci-cache/ar6-tools/go-pmtiles.tar.gz' | sha256sum -c -
            tar -xzf ../../.ci-cache/ar6-tools/go-pmtiles.tar.gz -C ../../.ci-cache/ar6-tools pmtiles
          fi
          echo '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  ../../.ci-cache/ar6-tools/go-pmtiles.tar.gz' | sha256sum -c -

      - name: Validate complete nine-layer fixture build
        env:
          SEARISE_TIPPECANOE: ${{ github.workspace }}/.ci-cache/ar6-tools/tippecanoe
          SEARISE_TIPPECANOE_DECODE: ${{ github.workspace }}/.ci-cache/ar6-tools/tippecanoe-decode
          SEARISE_PMTILES: ${{ github.workspace }}/.ci-cache/ar6-tools/pmtiles
          SEARISE_TIPPECANOE_SOURCE: ${{ github.workspace }}/.ci-cache/ar6-tools/tippecanoe-2.79.0.tar.gz
          SEARISE_TIPPECANOE_BUILD_RECEIPT: toolchain/tippecanoe-linux-x86_64-build-receipt.json
          SEARISE_PMTILES_ASSET: ${{ github.workspace }}/.ci-cache/ar6-tools/go-pmtiles.tar.gz
          SEARISE_VECTOR_PLATFORM: linux-x86_64
          SEARISE_PYTHON_LOCK: requirements-release.lock
        run: pytest tests/release -q

  ar6-release-evidence:
    name: Full-source Linux AR6 candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_source_revision || github.sha }}

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: src/pipeline/requirements-release.lock

      - name: Install immutable Python release environment
        working-directory: src/pipeline
        run: |
          pip install --only-binary=:all: --require-hashes -r requirements-release.lock
          pip install -e . --no-deps

      - name: Restore verified release tools
        uses: actions/cache@v4.2.4
        with:
          path: ${{ runner.temp }}/ar6-tools
          key: ar6-evidence-tools-linux-x86_64-${{ hashFiles('src/pipeline/science/ar6-regional-release.json', 'src/pipeline/toolchain/Dockerfile.tippecanoe-linux-x86_64', 'src/pipeline/toolchain/tippecanoe-linux-x86_64-build-receipt.json') }}

      - name: Build and verify pinned Tippecanoe
        run: |
          tool_cache="${RUNNER_TEMP}/ar6-tools"
          mkdir -p "${tool_cache}"
          if [[ ! -f "${tool_cache}/tippecanoe-2.79.0.tar.gz" ]]; then
            curl --fail --location --retry 4 --output "${tool_cache}/tippecanoe-2.79.0.tar.gz" https://github.com/felt/tippecanoe/archive/refs/tags/2.79.0.tar.gz
          fi
          echo "b0fd9df49b6efc988288ea48774822c6de19eb48428017f27ee0b3b01d44f05d  ${tool_cache}/tippecanoe-2.79.0.tar.gz" | sha256sum -c -
          echo '8d5fb782ea81bc19c9c8d71e31aae19a01bc448f401fd10114f633bd2a6c2dc5  src/pipeline/toolchain/Dockerfile.tippecanoe-linux-x86_64' | sha256sum -c -
          if [[ ! -x "${tool_cache}/tippecanoe" || ! -x "${tool_cache}/tippecanoe-decode" ]]; then
            docker build --platform linux/amd64 --tag searise-tippecanoe:2.79.0 \
              --file src/pipeline/toolchain/Dockerfile.tippecanoe-linux-x86_64 \
              "${tool_cache}"
            docker run --platform linux/amd64 --rm \
              --volume "${tool_cache}:/out" \
              searise-tippecanoe:2.79.0
          fi
          echo "a70bb67594919b0eae357ec4678c77f5c3b9d4a277bd11046e4d9d03b1c6c426  ${tool_cache}/tippecanoe" | sha256sum -c -
          echo "27d15c0f9394b2b29187312103a94579a9262a365d5b3eb71f1e5677751d2c36  ${tool_cache}/tippecanoe-decode" | sha256sum -c -

      - name: Acquire and verify pinned go-pmtiles
        run: |
          tool_cache="${RUNNER_TEMP}/ar6-tools"
          if [[ ! -f "${tool_cache}/go-pmtiles_1.31.2_Linux_x86_64.tar.gz" ]]; then
            curl --fail --location --retry 4 --output "${tool_cache}/go-pmtiles_1.31.2_Linux_x86_64.tar.gz" https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          fi
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  ${tool_cache}/go-pmtiles_1.31.2_Linux_x86_64.tar.gz" | sha256sum -c -
          if [[ ! -x "${tool_cache}/pmtiles" ]]; then
            tar -xzf "${tool_cache}/go-pmtiles_1.31.2_Linux_x86_64.tar.gz" \
              -C "${tool_cache}" pmtiles
          fi

      - name: Preflight exact release environment and fixture
        env:
          PYTHONPATH: src/pipeline
        run: |
          tool_cache="${RUNNER_TEMP}/ar6-tools"
          python -c 'import searise_pipeline.release'
          python scripts/science/build_ar6_regional_release.py \
            --fixture src/pipeline/fixtures/ar6-regional-release/source-fixture.json.gz \
            --fixture-receipt src/pipeline/fixtures/ar6-regional-release/source-fixture-receipt.json \
            --source-lock src/pipeline/sources/source-lock.json \
            --source-semantics src/pipeline/science/source-semantics.json \
            --release-contract src/pipeline/science/ar6-regional-release.json \
            --lookup-goldens src/pipeline/science/evidence/ar6-lookup-goldens.json \
            --tippecanoe "${tool_cache}/tippecanoe" \
            --tippecanoe-decode "${tool_cache}/tippecanoe-decode" \
            --pmtiles "${tool_cache}/pmtiles" \
            --tippecanoe-source-archive "${tool_cache}/tippecanoe-2.79.0.tar.gz" \
            --tippecanoe-build-receipt src/pipeline/toolchain/tippecanoe-linux-x86_64-build-receipt.json \
            --pmtiles-distribution-asset "${tool_cache}/go-pmtiles_1.31.2_Linux_x86_64.tar.gz" \
            --pmtiles-distribution-platform linux-x86_64 \
            --python-lock src/pipeline/requirements-release.lock \
            --build-environment-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-linux-x86_64-preflight" \
            --release-id phase-0r-ar6-preflight \
            --output /tmp/phase-0r-ar6-preflight \
            --failure-gate /tmp/ar6-release-preflight-failure.json \
            --timing-evidence /tmp/build-timing-preflight.json

      - name: Acquire and verify locked AR6 archive
        run: |
          curl --fail --location --retry 8 --retry-all-errors \
            --output /tmp/ar6-regional-confidence.zip \
            https://zenodo.org/api/records/6382554/files/ar6-regional-confidence.zip/content
          echo 'd3b1c2ed093cca491db2461e67b782bcca98763d326378ffee39908c2b094e91  /tmp/ar6-regional-confidence.zip' | sha256sum -c -

      - name: Build full real-source candidate
        env:
          PYTHONPATH: src/pipeline
        run: |
          tool_cache="${RUNNER_TEMP}/ar6-tools"
          python scripts/science/build_ar6_regional_release.py \
            --archive /tmp/ar6-regional-confidence.zip \
            --source-lock src/pipeline/sources/source-lock.json \
            --source-semantics src/pipeline/science/source-semantics.json \
            --release-contract src/pipeline/science/ar6-regional-release.json \
            --lookup-goldens src/pipeline/science/evidence/ar6-lookup-goldens.json \
            --tippecanoe "${tool_cache}/tippecanoe" \
            --tippecanoe-decode "${tool_cache}/tippecanoe-decode" \
            --pmtiles "${tool_cache}/pmtiles" \
            --tippecanoe-source-archive "${tool_cache}/tippecanoe-2.79.0.tar.gz" \
            --tippecanoe-build-receipt src/pipeline/toolchain/tippecanoe-linux-x86_64-build-receipt.json \
            --pmtiles-distribution-asset "${tool_cache}/go-pmtiles_1.31.2_Linux_x86_64.tar.gz" \
            --pmtiles-distribution-platform linux-x86_64 \
            --python-lock src/pipeline/requirements-release.lock \
            --build-environment-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-linux-x86_64" \
            --release-id phase-0r-ar6-v1 \
            --output /tmp/phase-0r-ar6-v1 \
            --failure-gate /tmp/ar6-release-failure.json \
            --timing-evidence /tmp/build-timing-linux.json

      - name: Summarize candidate
        run: |
          {
            echo '## AR6 Linux release candidate'
            echo
            jq -r '"Source revision: `\(.sourceRevision)`"' /tmp/phase-0r-ar6-v1/build-receipt.json
            echo
            jq -r '"Core artifacts: \(.totals.coreArtifactBytes) bytes\n\nCOGs: \(.totals.cogBytes) bytes\n\nPMTiles: \(.totals.pmtilesBytes) bytes\n\nGeoParquet: \(.totals.geoparquetBytes) bytes"' /tmp/phase-0r-ar6-v1/manifest.json
            echo
            jq -r '"Full clean build: \(.fullCleanBuildDurationSeconds) seconds"' /tmp/build-timing-linux.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload independently built candidate and timing
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ar6-linux-candidate-${{ inputs.release_source_revision || github.sha }}-${{ github.run_id }}
          path: |
            /tmp/phase-0r-ar6-v1
            /tmp/build-timing-linux.json
          if-no-files-found: error
          retention-days: 14

  infrastructure:
    name: Infrastructure (compose config)
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Validate compose model
        run: docker compose config --quiet

      - name: Compile blob seed
        run: python3 -m py_compile infra/blob-seed/seed.py

  docker-frontend:
    name: Docker Build (frontend)
    needs: changes
    if: needs.changes.outputs.docker_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Build frontend image
        run: docker build -t searise-frontend:ci src/frontend

  docker-api:
    name: Docker Build (api)
    needs: changes
    if: needs.changes.outputs.docker_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Build API image
        run: docker build -t searise-api:ci src/api

  compose-smoke:
    name: Compose Smoke (full stack health)
    needs:
      - changes
      - frontend
      - api
      - infrastructure
      - docker-frontend
      - docker-api
    if: >-
      always() &&
      needs.changes.outputs.compose == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Run compose smoke test
        env:
          WAIT_TIMEOUT: "300"
        run: bash scripts/compose-smoke.sh

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - frontend
      - api
      - pipeline
      - release-toolchain
      - ar6-release-evidence
      - infrastructure
      - docker-frontend
      - docker-api
      - compose-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize routed jobs
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Path-aware CI"
            echo
            echo '| Job | Result |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"${JOBS}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify routed jobs
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' <<<"${JOBS}" >/dev/null; then
            echo "A required routed job failed or was cancelled."
            exit 1
          fi
          echo "All selected jobs passed; unselected jobs were skipped."
